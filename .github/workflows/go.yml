name: go

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the Justfile
  STATICCHECK_VERSION: v0.8.2
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Build capture binary
        run: go build -o dist/capture ./cmd/capture/
      # The race detector needs cgo and a C compiler, which the Windows image does not
      # guarantee; it is not platform-specific, so the other three runners cover it.
      - name: Run unit and integration tests
        shell: bash
        run: |
          race="-race"
          if [ "${RUNNER_OS}" = "Windows" ]; then race=""; fi
          go test ${race} -v -timeout 3m ./...

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      # golangci-lint run does not report formatting, so check it separately
      - name: Check formatting
        run: golangci-lint fmt --diff
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      # Platform-specific files (build tags) are only checked when GOOS matches
      - name: Run linters for each target OS
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=${goos}"
            GOOS="${goos}" go vet ./...
            GOOS="${goos}" staticcheck -checks=all,-ST1000,-U1000 ./...
            GOOS="${goos}" golangci-lint run
            echo "::endgroup::"
          done
      # Releases include 32-bit ARM, where int is 32 bits; catch overflowing constants before a tag
      - name: Vet 32-bit ARM
        run: GOOS=linux GOARCH=arm GOARM=6 go vet ./...
      - name: Check for vulnerabilities
        run: |
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -format json ./... > govulncheck.json
          ./.github/scripts/govulncheck-gate.sh govulncheck.json
