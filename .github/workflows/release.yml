name: release

on:
  push:
    tags:
      # It will be triggered when a new tag starting with 'v' is pushed
      # v1.0.0, v1.0.1, ...
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      # A tag can point at any commit, so do not publish one that fails its tests
      - name: Run tests
        run: go test -count=1 -race -timeout 3m ./...
      # GoReleaser calls syft to generate the SBOMs
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Pass the GitHub token to GoReleaser
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the registry and image name to GoReleaser
          KO_DOCKER_REPO: ghcr.io/bluewave-labs/capture
